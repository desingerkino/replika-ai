name: Сборка iOS AI (без подписи)

on:
  workflow_dispatch:
    inputs:
      splash_shot:
        description: 'Показать в сводке снимок стартового экрана (для сверки с эталоном)'
        type: boolean
        default: false

jobs:
  ios-ai:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Версии
        run: |
          flutter --version
          dart --version
          xcodebuild -version

      - name: Подготовка (слой ИИ, llamadart, iOS 16.4)
        run: bash tool/prepare_ai_ios.sh

      - name: Анализ кода слоя ИИ
        run: |
          set +e
          flutter analyze lib --no-fatal-infos --no-fatal-warnings > analyze_ai.txt 2>&1
          code=$?
          cat analyze_ai.txt
          # Ошибки видны в сводке запуска, а не только в журнале.
          python3 - <<'PY'
          text = open('analyze_ai.txt', encoding='utf-8', errors='replace').read()
          errors = [l for l in text.splitlines() if ' • ' in l and l.lstrip().startswith('error')]
          body = '\n'.join(errors) or 'ошибок нет'
          enc = body[:3500].replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          print(f"::notice title=analyze AI - ошибок {len(errors)}::{enc}")
          PY
          exit $code

      - name: Сборка iOS (release)
        run: flutter build ios --release --no-codesign -t lib/main_ai.dart

      - name: Размер приложения
        run: |
          du -sh build/ios/iphoneos/Runner.app
          du -sh build/ios/iphoneos/Runner.app/Frameworks/* 2>/dev/null || true

      - name: Неподписанный архив
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr replika-ai-unsigned.ipa Payload
          ls -lh replika-ai-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: replika-ai-ios-unsigned
          path: replika-ai-unsigned.ipa

  # Автотесты и анализ всего проекта без слоя ИИ (как раньше, на Ubuntu).
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Зависимости
        run: flutter pub get

      - name: Анализ кода (весь проект)
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1
          code=$?
          cat analyze.txt
          python3 - <<'PY'
          text = open('analyze.txt', encoding='utf-8', errors='replace').read()
          issues = [l for l in text.splitlines() if ' • ' in l]
          def emit(level, title, body, limit=3500, max_chunks=10):
              chunks = [body[i:i + limit] for i in range(0, len(body), limit)][:max_chunks]
              for n, c in enumerate(chunks, 1):
                  enc = c.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
                  print(f"::{level} title={title} {n} из {len(chunks)}::{enc}")
          emit('notice', f'analyze - замечаний {len(issues)}', '\n'.join(issues) or text)
          PY
          exit $code

      - name: Автотесты
        run: |
          set +e
          flutter test --reporter json > test_results.json
          code=$?
          python3 - <<'PY'
          import json
          tests, errors, prints = {}, {}, {}
          passed = failed = skipped = 0
          for line in open('test_results.json', encoding='utf-8', errors='replace'):
              try:
                  e = json.loads(line)
              except ValueError:
                  continue
              t = e.get('type')
              if t == 'testStart':
                  tests[e['test']['id']] = e['test']['name']
              elif t == 'error':
                  errors.setdefault(e['testID'], []).append(e.get('error', ''))
              elif t == 'print':
                  # У виджет-тестов подробности падения приходят печатью.
                  prints.setdefault(e.get('testID'), []).append(e.get('message', ''))
              elif t == 'testDone' and not e.get('hidden'):
                  if e.get('skipped'):
                      skipped += 1
                  elif e['result'] == 'success':
                      passed += 1
                  else:
                      failed += 1
          lines = [f"прошло {passed}, упало {failed}, пропущено {skipped}"]
          for tid, errs in errors.items():
              name = tests.get(tid, str(tid))
              if name.startswith('loading '):
                  name = 'ЗАГРУЗКА ' + name[len('loading '):]
              lines.append('FAIL: ' + name)
              lines.append('   ' + ' | '.join(x.strip() for x in errs)[:600].replace('\n', ' / '))
              detail = '\n'.join(prints.get(tid, []))
              if 'EXCEPTION CAUGHT' in detail:
                  detail = detail[detail.index('EXCEPTION CAUGHT'):]
                  lines.append('   ' + detail[:900].replace('\n', ' / '))
          def emit(level, title, body, limit=3500, max_chunks=10):
              chunks = [body[i:i + limit] for i in range(0, len(body), limit)][:max_chunks]
              for n, c in enumerate(chunks, 1):
                  enc = c.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
                  print(f"::{level} title={title} {n} из {len(chunks)}::{enc}")
          level = 'error' if failed or errors else 'notice'
          emit(level, f'tests - упало {failed} прошло {passed}', '\n'.join(lines))
          PY
          exit $code

      # Снимок стартового экрана из автотеста — в сводку запуска (см.
      # tool/ci_emit_image.py). Только когда запуск просит об этом.
      - name: Снимок стартового экрана (1)
        if: ${{ always() && inputs.splash_shot }}
        run: |
          pip install --quiet pillow
          python3 tool/ci_emit_image.py splash 0 build/splash_shot_a.png build/splash_shot_b.png
      - name: Снимок стартового экрана (2)
        if: ${{ always() && inputs.splash_shot }}
        run: python3 tool/ci_emit_image.py splash 1 build/splash_shot_a.png build/splash_shot_b.png
      - name: Снимок стартового экрана (3)
        if: ${{ always() && inputs.splash_shot }}
        run: python3 tool/ci_emit_image.py splash 2 build/splash_shot_a.png build/splash_shot_b.png
      - name: Снимок стартового экрана (4)
        if: ${{ always() && inputs.splash_shot }}
        run: python3 tool/ci_emit_image.py splash 3 build/splash_shot_a.png build/splash_shot_b.png
