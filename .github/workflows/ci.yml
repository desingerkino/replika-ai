name: Проверка кода (Flutter)

on:
  push:
    branches: [main, new-ui-ios27, "claude/**"]
  pull_request:
  workflow_dispatch:

# Ошибки шагов дублируются аннотациями (::error), чтобы их было видно
# в сводке проверки без скачивания полного журнала.

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version

      - run: flutter pub get

      - name: Анализ кода
        run: |
          set +e
          flutter analyze --no-fatal-infos > analyze.txt 2>&1
          code=$?
          cat analyze.txt
          if [ $code -ne 0 ]; then
            body=$( (grep -vE '^\s*info' analyze.txt | grep -vE '^\s*$' | tail -n 150; echo "end") | tail -c 60000 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=flutter analyze::${body}"
          fi
          exit $code

      - name: Тесты
        run: |
          set +e
          flutter test --reporter expanded > test.txt 2>&1
          code=$?
          cat test.txt
          if [ $code -ne 0 ]; then
            body=$( (grep -n -A 16 '\[E\]' test.txt | grep -vE '^[0-9]+-\s*$' | head -n 400; tail -n 8 test.txt) | head -c 60000 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=flutter test::${body}"
          fi
          exit $code

  # Снимки экранов в обеих темах — для визуальной проверки редизайна.
  # Кладутся в ветку ci-screens (только для веток claude/**).
  screens:
    runs-on: ubuntu-latest
    needs: analyze-test
    if: startsWith(github.ref_name, 'claude/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Снимки экранов
        continue-on-error: true
        run: |
          set +e
          flutter pub get
          REPLIKA_SCREENSHOTS=1 flutter test test/screenshots_test.dart --update-goldens > shots.txt 2>&1
          code=$?
          cat shots.txt
          if [ $code -ne 0 ]; then
            body=$( (grep -n -A 16 '\[E\]\|EXCEPTION' shots.txt | head -n 200; tail -n 20 shots.txt) | head -c 50000 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::warning title=screenshots::${body}"
          fi

      - name: Отправить снимки в ветку ci-screens
        run: |
          ls test/shots || exit 0
          mkdir -p /tmp/shots && cp test/shots/*.png /tmp/shots/ || exit 0
          cd /tmp/shots
          git init -q -b ci-screens
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -qm "Снимки экранов ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-screens

  android:
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Сборка Android (release APK)
        run: |
          set +e
          (bash tool/prepare_android.sh && flutter pub get && flutter build apk --release) > build.txt 2>&1
          code=$?
          cat build.txt
          if [ $code -ne 0 ]; then
            body=$( (grep -nE 'error|Error|FAILURE|What went wrong' build.txt | tail -n 150; tail -n 40 build.txt) | tail -c 50000 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=android build::${body}"
          fi
          exit $code

      - name: Размер APK
        run: |
          ls -lh build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/app-release.apk replika.apk

      - name: Файл установки Android
        uses: actions/upload-artifact@v4
        with:
          name: replika-android-apk
          path: replika.apk
          retention-days: 30

  ios:
    runs-on: macos-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Сборка iOS (release, без подписи)
        run: |
          set +e
          (bash tool/prepare_ios.sh && flutter pub get && flutter build ios --release --no-codesign) > build.txt 2>&1
          code=$?
          cat build.txt
          if [ $code -ne 0 ]; then
            body=$( (grep -nE 'error|Error|FAILED|failed' build.txt | tail -n 150; tail -n 40 build.txt) | tail -c 50000 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=ios build::${body}"
          fi
          exit $code

      - name: Неподписанный IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr replika-unsigned.ipa Payload
          ls -lh replika-unsigned.ipa

      - name: Файл установки iOS
        uses: actions/upload-artifact@v4
        with:
          name: replika-ios-unsigned-ipa
          path: replika-unsigned.ipa
          retention-days: 30
