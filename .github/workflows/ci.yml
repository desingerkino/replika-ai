name: Проверка кода (Flutter)

on:
  push:
    branches: [main, new-ui-ios27, "claude/**"]
  pull_request:
  workflow_dispatch:

# Ошибки шагов дублируются аннотациями (::error), чтобы их было видно
# в сводке проверки без скачивания полного журнала.

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version

      - run: flutter pub get

      - name: Анализ кода
        run: |
          set +e
          flutter analyze --no-fatal-infos > analyze.txt 2>&1
          code=$?
          cat analyze.txt
          if [ $code -ne 0 ]; then
            body=$( (grep -vE '^\s*info' analyze.txt | grep -vE '^\s*$' | tail -n 150; echo "end") | tail -c 60000 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=flutter analyze::${body}"
          fi
          exit $code

      - name: Тесты
        run: |
          set +e
          flutter test --reporter expanded > test.txt 2>&1
          code=$?
          cat test.txt
          if [ $code -ne 0 ]; then
            body=$( (grep -nE '\[E\]|EXCEPTION CAUGHT|Expected:|Actual:|Error:|error:|Which:|The following|FAILED|══╡|\.dart [0-9]+:[0-9]+' test.txt | head -n 300; tail -n 30 test.txt) | head -c 60000 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=flutter test::${body}"
          fi
          exit $code

  android:
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Сборка Android (release APK)
        run: |
          set +e
          (bash tool/prepare_android.sh && flutter pub get && flutter build apk --release) > build.txt 2>&1
          code=$?
          cat build.txt
          if [ $code -ne 0 ]; then
            body=$( (grep -nE 'error|Error|FAILURE|What went wrong' build.txt | tail -n 150; tail -n 40 build.txt) | tail -c 50000 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=android build::${body}"
          fi
          exit $code

      - name: Размер APK
        run: ls -lh build/app/outputs/flutter-apk/

  ios:
    runs-on: macos-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Сборка iOS (release, без подписи)
        run: |
          set +e
          (bash tool/prepare_ios.sh && flutter pub get && flutter build ios --release --no-codesign) > build.txt 2>&1
          code=$?
          cat build.txt
          if [ $code -ne 0 ]; then
            body=$( (grep -nE 'error|Error|FAILED|failed' build.txt | tail -n 150; tail -n 40 build.txt) | tail -c 50000 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=ios build::${body}"
          fi
          exit $code
